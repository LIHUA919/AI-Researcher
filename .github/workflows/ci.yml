name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.11.13
      - name: Lint maintained Python sources
        run: |
          ruff check \
            research_agent \
            paper_agent \
            benchmark_collection \
            tests \
            main_ai_researcher.py \
            web_ai_researcher.py \
            global_state.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[test]" || pip install -e .
          pip install pytest
      - name: Run tests
        env:
          DEBUG: "False"
          DEFAULT_LOG: "False"
        run: pytest tests/ -v --tb=short
